[package]
name = "strand-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strandc = { path = "../strandc" }
# The maintained continuation of `tower-lsp`, whose last release was 2023.
# Same API; it handles the initialize handshake, capability negotiation and
# shutdown so this crate only has to answer questions.
tower-lsp-server = "0.23"
tokio = { version = "1.53.1", features = ["full"] }
tracing.workspace = true
